[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gate0-sfv"
version = "0.1.0"
description = "Falsifiable Gate-0 experiment for self-fulfilling verification in robotic insertion"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.9,<4",
  "mujoco>=3.2,<4",
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "pyarrow>=17,<23",
  "PyYAML>=6,<7",
  "scikit-learn>=1.5,<2",
  "scipy>=1.14,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = ["gate0"]
