experiment:
  name: gate0-main-frozen-v2
  parent_count: 500
  seed_start: 20000
  output_root: runs
simulation:
  timestep: 0.002
  task_steps: [180, 300]
  settle_steps: [100, 140]
  verification_steps: 80
model:
  peg_half_size: [0.009, 0.009, 0.025]
  hole_top_z: 0.080
  socket_depth: 0.036
  wall_thickness: 0.014
  clearance: [0.0004, 0.0018]
  friction: [0.25, 0.90]
  contact_timeconst: [0.0045, 0.0080]
  contact_dampratio: [0.80, 1.20]
  contact_width: [0.0007, 0.0013]
  peg_mass: 0.10
  dof_damping: 1.5
  angular_damping: 0.02
success:
  depth_threshold: 0.028
  lateral_threshold: 0.0015
  angular_threshold_deg: 3.0
randomization:
  initial_xy: [-0.006, 0.006]
  initial_z: [0.123, 0.135]
  initial_tilt_deg: [-6.0, 6.0]
  target_xy_noise: [-0.0025, 0.0025]
  target_depth_noise: [-0.005, 0.004]
  nominal_target_depth: 0.030
  lateral_kp: [12.0, 32.0]
  axial_kp: [20.0, 42.0]
  angular_kp: [0.04, 0.12]
  controller_noise: [0.0, 0.025]
  actuation_noise: [0.0, 0.020]
  max_force: [0.55, 1.05]
verification:
  branches:
    V0: {type: hold, strength: 0.0}
    V1: {type: passive, strength: 0.0}
    V2: {type: axial_probe, strength: 0.02}
    V3: {type: axial_probe, strength: 0.08}
    V4: {type: axial_probe, strength: 0.12}
analysis:
  bootstrap_samples: 1000
  confidence_level: 0.95
  test_fraction: 0.30
  split_seed: 31415
  classifier_seed: 2718
  falsification_rule: max_predeclared_suite
  resample_steps: 32
  margin_bins: [-1000000.0, -2.5, -1.0, -0.25, 0.0, 1000000.0]
  margin_labels: [far_failure, medium_distance, near_boundary, very_near_boundary, success]
gate:
  min_vic: 0.02
  min_vic_increase: 0.02
  min_post_recoverability: 0.80
  min_pre_recoverability_drop: 0.05
  max_full_trace_pre_recoverability: 0.95
  max_v0_completion: 0.05
  max_strong_probe_vic: 0.85
  max_very_near_vic_fraction: 0.80
